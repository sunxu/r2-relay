name: macOS manager offline checks
on:
  pull_request:
    paths:
      - 'ops/macos/**'
      - 'tests/test_macos_manage.py'
      - '.github/workflows/macos-manager-tests.yml'
  push:
    branches: [main]
    paths:
      - 'ops/macos/**'
      - 'tests/test_macos_manage.py'
      - '.github/workflows/macos-manager-tests.yml'
permissions:
  contents: read
jobs:
  offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_macos_manage.py -v
      - run: python -m py_compile ops/macos/manage.py