name: R2 Caddy IP TLS MCP safety tests
on:
  pull_request:
    paths:
      - 'ops/r2_https_ip_control.py'
      - 'ops/r2_rootd.py'
      - 'ops/generic_vps_mcp.py'
      - 'ops/bootstrap_r2_https_ip.py'
      - 'tests/test_r2_https_ip_control.py'
      - 'tests/test_bootstrap_r2_https_ip.py'
      - '.github/workflows/r2-caddy-ip-control.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_r2_https_ip_control.py tests/test_bootstrap_r2_https_ip.py tests/test_generic_vps_mcp.py tests/test_r2_mcp_install_integration.py tests/test_r2_rootd.py tests/test_r2_https_ip_selfsigned.py
