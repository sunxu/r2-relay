name: VPS deployment controller tests

on:
  push:
    branches: [main]
  # This job is a required branch-protection check; do not use paths filters.
  # Every pull request must publish the deploy-tests status, including Mac-only PRs.
  pull_request:

permissions:
  contents: read

jobs:
  deploy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install locked VPS runtime and test dependencies
        run: python -m pip install -r deploy/requirements-vps.lock "pytest>=8,<10" "pytest-asyncio>=0.24,<2"
      - name: Test deployment safety
        run: python -m pytest -q tests/test_github_actions_deploy.py
      - name: Test deployment state verification
        run: python -m pytest -q tests/test_r2_loopback_control.py
      - name: Test VPS download configuration
        run: PYTHONPATH=vps python -m pytest -q vps/tests/test_download_config.py
      - name: Compile deployment and VPS configuration code
        run: python -m py_compile ops/r2relay_deploy_receiver.py ops/bootstrap_github_actions_deploy.py vps/r2relay_vps/config.py vps/r2relay_vps/app.py
