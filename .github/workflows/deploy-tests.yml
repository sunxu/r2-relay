name: VPS deployment controller tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "ops/r2relay_deploy_receiver.py"
      - "ops/bootstrap_github_actions_deploy.py"
      - "tests/test_github_actions_deploy.py"
      - "ops/r2_loopback_control.py"
      - "tests/test_r2_loopback_control.py"
      - "deploy/**"
      - ".github/workflows/deploy-production.yml"
      - ".github/workflows/deploy-tests.yml"

permissions:
  contents: read

jobs:
  deploy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install "pytest>=8,<10"
      - name: Test deployment safety
        run: python -m pytest -q tests/test_github_actions_deploy.py
      - name: Test deployment state verification
        run: python -m pytest -q tests/test_r2_loopback_control.py
      - name: Compile deployment code
        run: python -m py_compile ops/r2relay_deploy_receiver.py ops/bootstrap_github_actions_deploy.py
