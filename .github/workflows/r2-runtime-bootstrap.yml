name: R2 runtime upgrade bootstrap tests
on:
  pull_request:
    paths:
      - 'ops/bootstrap_r2_runtime_service.py'
      - 'tests/test_bootstrap_r2_runtime_service.py'
      - '.github/workflows/r2-runtime-bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_bootstrap_r2_runtime_service.py
