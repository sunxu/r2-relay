name: Read-only VPS MCP inspection tests
on:
  pull_request:
    paths:
      - "ops/**"
      - "tests/test_deployment_inspect.py"
      - ".github/workflows/vps-inspect.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_deployment_inspect.py
