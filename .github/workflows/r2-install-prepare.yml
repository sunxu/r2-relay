name: R2 install prepare tests
on:
  pull_request:
    paths:
      - 'ops/r2_install_prepare.py'
      - 'tests/test_r2_install_prepare.py'
      - 'docs/R2_MCP_INSTALL_PREPARE_CN.md'
      - '.github/workflows/r2-install-prepare.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_r2_install_prepare.py
