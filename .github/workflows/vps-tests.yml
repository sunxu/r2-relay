name: VPS tests
on:
  pull_request:
    paths:
      - "vps/**"
      - ".github/workflows/vps-tests.yml"
  push:
    branches: [main]
    paths:
      - "vps/**"
      - ".github/workflows/vps-tests.yml"
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e './vps[test]'
      - name: Test VPS
        run: cd vps && python -m pytest -q
