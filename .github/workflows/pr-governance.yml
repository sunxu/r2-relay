name: PR governance
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  validate:
    name: PR governance
    runs-on: ubuntu-latest
    steps:
      - name: Check requirement, issue and acceptance references
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const message = pr.title + '\n' + body;
            const rlys = [...new Set((message.match(/\bRLY-\d{3}\b/g)||[]))];
            const tests = [...new Set((body.match(/\bT\d{2}\b/g)||[]))];
            const refs = [...body.matchAll(/\b(?:close[sd]?|fix(?:es|ed)?|resolve[sd]?|refs?)\s+#(\d+)\b/ig)].map(m=>Number(m[1]));
            if(!rlys.length) core.setFailed('PR title/body must include a requirement ID RLY-xxx');
            if(!tests.length) core.setFailed('PR body must refer to at least one Txx acceptance test');
            if(!refs.length) core.setFailed('PR body must reference an Issue with Closes #N or Refs #N');
            const {owner,repo}=context.repo;
            for(const issue_number of [...new Set(refs)]) {
              try {
                const item=await github.rest.issues.get({owner,repo,issue_number});
                if(item.data.pull_request) core.setFailed('#'+issue_number+' is a PR, not an Issue');
              } catch(err) {
                core.setFailed('Issue #'+issue_number+' could not be read: '+err.message);
              }
            }
            core.info('Requirements: '+rlys.join(', ')+', tests: '+tests.join(', ')+', linked issues: '+refs.join(', '));
