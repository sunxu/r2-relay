name: R2 MCP install integration tests
on:
  pull_request:
    paths:
      - 'ops/r2_rootd.py'
      - 'ops/generic_vps_mcp.py'
      - 'tests/test_r2_mcp_install_integration.py'
      - '.github/workflows/r2-mcp-install-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_r2_rootd.py tests/test_generic_vps_mcp.py tests/test_r2_mcp_install_integration.py
