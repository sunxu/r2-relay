name: R2 root daemon socket tests
on:
  pull_request:
    paths:
      - "ops/r2_rootd.py"
      - "ops/r2_root_socket_client.py"
      - "ops/r2-rootd.service"
      - "tests/test_r2_rootd.py"
      - ".github/workflows/r2-rootd-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_r2_rootd.py
