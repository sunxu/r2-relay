name: 本地代理测试
on:
  pull_request:
    paths:
      - "local/**"
      - "vps/**"
      - "ops/**"
      - "tests/**"
      - "docs/**"
      - ".github/workflows/local-tests.yml"
  push:
    branches: [main]
    paths:
      - "local/**"
      - ".github/workflows/local-tests.yml"
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e './local[test]' -e './vps[test]'
      - name: 验证本地代理与 1 GiB 磁盘响应 PoC（HTTP/1.1、客户端断开传播）
        run: cd local && R2_POC_SIZE_MIB=1024 python -m pytest -q -s
