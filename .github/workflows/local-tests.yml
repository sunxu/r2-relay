name: Local proxy tests
on:
  pull_request:
    paths:
      - "local/**"
      - "vps/**"
      - "ops/**"
      - "tests/**"
      - ".github/workflows/local-tests.yml"
  push:
    branches: [main]
    paths:
      - "local/**"
      - ".github/workflows/local-tests.yml"
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e './local[test]' -e './vps[test]'
      - name: Test local proxy
        run: cd local && python -m pytest -q
