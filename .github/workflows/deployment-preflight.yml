name: Offline deployment preflight
on:
  pull_request:
    paths:
      - "deploy/**"
      - "scripts/deployment_preflight.py"
      - "tests/test_deployment_preflight.py"
      - "docs/DEPLOYMENT.md"
      - ".github/workflows/deployment-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  config:
    name: Config policy + systemd + real Caddy parser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Static tests, including unsafe variants
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_deployment_preflight.py
      - name: SAFE predeployment report
        run: |
          mkdir -p artifacts
          python scripts/deployment_preflight.py --report artifacts/deployment-preflight-safe.json
      - name: Validate systemd unit grammar
        run: |
          systemd-analyze verify deploy/vps.service 2> artifacts/systemd-verify.txt || {
            cat artifacts/systemd-verify.txt
            exit 1
          }
      - name: Validate real Caddyfile parser with offline dummy TLS certificate
        run: |
          mkdir -p artifacts/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout artifacts/certs/test.key -out artifacts/certs/test.crt \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost' \
            >/dev/null 2>&1
          sed -e 's#{$R2_RELAY_HOST}#localhost#g' \
              -e "s#{$R2_RELAY_TLS_CERT}#${PWD}/artifacts/certs/test.crt#g" \
              -e "s#{$R2_RELAY_TLS_KEY}#${PWD}/artifacts/certs/test.key#g" \
              deploy/Caddyfile.example > artifacts/Caddyfile.test
          docker run --rm --network none \
            -v "${PWD}/artifacts:/work:ro" \
            -w /work caddy:2 caddy validate --config /work/Caddyfile.test --adapter caddyfile
      - name: Upload SAFE report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-deployment-preflight-safe
          path: artifacts/deployment-preflight-safe.json
          if-no-files-found: warn
          retention-days: 30
