name: Offline benchmark smoke
on:
  pull_request:
    paths:
      - "benchmarks/**"
      - "local/**"
      - "vps/**"
      - ".github/workflows/offline-benchmark.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e './local[test]' -e './vps[test]'
      - name: Smoke test
        run: python -m pytest -q benchmarks/test_offline_benchmark.py
      - name: Offline benchmark
        run: python benchmarks/offline_benchmark.py --parts 8 --part-mib 1 --parallel 4
      - name: Full offline 100x10MiB load (mock transport; no real bandwidth)
        run: python benchmarks/offline_benchmark.py --parts 100 --part-mib 10 --parallel 8
